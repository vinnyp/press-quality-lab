name: confinement-spike
on:
  pull_request:
permissions:
  contents: read
jobs:
  confinement-spike:
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Record system and tool versions
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          go version
          clang --version | sed -n '1p'
      - name: Download modules
        run: go mod download
      - name: Run confinement spike
        env:
          CONFINEMENT_BUDGET_SCALE: "4"
        run: GOTOOLCHAIN=local GOPROXY=off go test -v -count=1 -timeout 130m -tags confinementspike -run '^(TestBehaviouralRefusalModifiers|TestRefusalStructure)$' ./spike/confinement/...
